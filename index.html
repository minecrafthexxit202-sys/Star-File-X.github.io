
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star File X - Chia Sẻ Tệp Nhanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e5e7eb; font-family: sans-serif; }
        .mono { font-family: monospace; }
        .tab-active { border-bottom: 2px solid #10b981; color: #10b981; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between">

    <div class="max-w-2xl mx-auto w-full">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 pb-4 border-b border-gray-800">
            <h1 class="text-xl font-bold tracking-wider mono text-emerald-400">STAR FILE X</h1>
            <button onclick="toggleModal()" class="text-xs bg-gray-800 hover:bg-gray-700 text-emerald-400 border border-emerald-800 px-3 py-1.5 rounded">
                ⚡ Hướng dẫn
            </button>
        </header>

        <!-- Tab Switcher (Gửi / Nhận) -->
        <div class="flex border-b border-gray-800 mb-6 text-center font-medium">
            <button id="tabSendBtn" onclick="switchTab('send')" class="flex-1 py-3 tab-active transition">
                📤 BÊN GỬI (Send)
            </button>
            <button id="tabReceiveBtn" onclick="switchTab('receive')" class="flex-1 py-3 text-gray-500 hover:text-gray-300 transition">
                📥 BÊN NHẬN (Receive)
            </button>
        </div>

        <!-- SECTION: BÊN GỬI -->
        <div id="sectionSend" class="space-y-4">
            <input type="file" id="fileInput" class="hidden" onchange="onFileSelected(this.files[0])">
            
            <div id="dropZone" onclick="document.getElementById('fileInput').click()" 
                 class="border-2 border-dashed border-gray-700 hover:border-emerald-500 rounded-xl p-8 text-center bg-gray-900/50 cursor-pointer transition">
                <div class="text-4xl mb-2">📁</div>
                <p class="text-base font-medium text-gray-300">Nhấp hoặc Kéo thả file vào đây để gửi</p>
                <p id="fileInfo" class="text-xs text-emerald-400 mt-2 mono font-bold"></p>
            </div>

            <button onclick="generateShareLink()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-lg transition">
                TẠO MÃ & LINK CHIA SẺ
            </button>

            <!-- Kết quả Link/Mã sau khi tạo -->
            <div id="shareResult" class="hidden bg-gray-900 border border-gray-800 p-4 rounded-lg space-y-3">
                <div>
                    <label class="text-xs text-gray-500 block mb-1">MÃ NHẬN FILE (6 Chữ Số):</label>
                    <div class="flex gap-2">
                        <input type="text" id="shareCode" readonly class="w-full bg-black border border-gray-700 px-3 py-2 rounded text-emerald-400 font-mono text-center font-bold text-lg">
                        <button onclick="copyToClipboard('shareCode')" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded text-xs border border-gray-700">Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION: BÊN NHẬN -->
        <div id="sectionReceive" class="space-y-4 hidden">
            <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl space-y-4">
                <label class="text-sm text-gray-300 block">Nhập mã nhận file được chia sẻ:</label>
                <input type="text" id="inputCode" placeholder="Ví dụ: 839201" class="w-full bg-black border border-gray-700 px-4 py-3 rounded-lg text-white font-mono text-center text-xl tracking-widest focus:border-emerald-500 outline-none">
                <button onclick="fetchFile()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-lg transition">
                    TÌM & TẢI FILE VE
                </button>
            </div>

            <!-- Khung hiển thị thông tin file tìm thấy để tải -->
            <div id="downloadArea" class="hidden bg-gray-900 border border-emerald-900/50 p-4 rounded-xl flex items-center justify-between">
                <div>
                    <p id="downloadFileName" class="text-sm font-bold text-white">document.pdf</p>
                    <p id="downloadFileSize" class="text-xs text-gray-500 mono">1.2 MB</p>
                </div>
                <a id="downloadBtn" class="bg-emerald-500 hover:bg-emerald-400 text-black font-bold px-4 py-2 rounded text-xs transition inline-block">
                    Tải Tệp Về
                </a>
            </div>
        </div>
    </div>

    <!-- Modal Hướng Dẫn -->
    <div id="guideModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-emerald-500/30 rounded-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-emerald-400">💡 Hướng dẫn nhanh</h3>
            <p class="text-sm text-gray-300"><b>Bên Gửi:</b> Chọn file -> Bấm "Tạo Mã" -> Copy mã 6 số gửi cho bạn bè.</p>
            <p class="text-sm text-gray-300"><b>Bên Nhận:</b> Chuyển qua tab "Bên Nhận" -> Nhập mã 6 số -> Bấm Tải tệp về.</p>
            <div class="text-right">
                <button onclick="toggleModal()" class="bg-emerald-600 text-black font-bold px-4 py-1.5 rounded text-sm">Đã hiểu</button>
            </div>
        </div>
    </div>

    <script>
        let currentSelectedFile = null;

        function toggleModal() {
            document.getElementById('guideModal').classList.toggle('hidden');
        }

        function switchTab(tab) {
            const sendBtn = document.getElementById('tabSendBtn');
            const receiveBtn = document.getElementById('tabReceiveBtn');
            const sendSec = document.getElementById('sectionSend');
            const receiveSec = document.getElementById('sectionReceive');

            if(tab === 'send') {
                sendBtn.classList.add('tab-active');
                receiveBtn.classList.remove('tab-active');
                sendSec.classList.remove('hidden');
                receiveSec.classList.add('hidden');
            } else {
                receiveBtn.classList.add('tab-active');
                sendBtn.classList.remove('tab-active');
                receiveSec.classList.remove('hidden');
                sendSec.classList.add('hidden');
            }
        }

        function onFileSelected(file) {
            if(!file) return;
            currentSelectedFile = file;
            document.getElementById('fileInfo').innerText = `Đã chọn: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
        }

        function generateShareLink() {
            if(!currentSelectedFile) {
                alert('Vui lòng chọn 1 file trước!');
                return;
            }
            // Tạo mã ngẫu nhiên 6 chữ số
            const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('shareCode').value = randomCode;
            document.getElementById('shareResult').classList.remove('hidden');

            // Lưu file tạm vào SessionStorage để thử nghiệm giả lập nhận file trên cùng trình duyệt
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = {
                    name: currentSelectedFile.name,
                    size: (currentSelectedFile.size/1024/1024).toFixed(2) + ' MB',
                    data: e.target.result
                };
                sessionStorage.setItem('file_' + randomCode, JSON.stringify(fileData));
            };
            reader.readAsDataURL(currentSelectedFile);
        }

        function fetchFile() {
            const code = document.getElementById('inputCode').value.trim();
            const storedData = sessionStorage.getItem('file_' + code);

            if(!storedData) {
                alert('Mã nhận file không tồn tại hoặc đã hết hạn!');
                return;
            }

            const fileObj = JSON.parse(storedData);
            document.getElementById('downloadFileName').innerText = fileObj.name;
            document.getElementById('downloadFileSize').innerText = fileObj.size;
            
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.href = fileObj.data;
            dlBtn.download = fileObj.name;

            document.getElementById('downloadArea').classList.remove('hidden');
        }

        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('Đã copy mã: ' + copyText.value);
        }
    </script>
</body>
</html>
